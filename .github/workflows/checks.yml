name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: pip install -e '.[dev]'
      - run: pip check
      - run: pytest -q
      - run: ruff check .
      - run: python -m lineament_analyzer.app --self-test
  windows-exe:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pip check
      - run: pytest -q
      - run: ruff check .
      - run: python -m lineament_analyzer.app --self-test
      # PyInstaller's QtWidgets hook includes the Qt platform plugins.
      # Rasterio and pyproj also need their dynamic modules and GDAL/PROJ data.
      - run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name LineamentAnalyzer --collect-all rasterio --collect-all pyproj src/lineament_analyzer/app.py
      - name: Verify Qt platform plugin and frozen runtime
        shell: pwsh
        run: |
          $plugin = Get-ChildItem dist/LineamentAnalyzer -Recurse -Filter qwindows.dll
          if (-not $plugin) { throw "Qt Windows platform plugin missing" }
          $process = Start-Process -FilePath dist/LineamentAnalyzer/LineamentAnalyzer.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw "Frozen self-test timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Frozen self-test failed with $($process.ExitCode)" }
      - run: Compress-Archive -Path dist/LineamentAnalyzer -DestinationPath dist/LineamentAnalyzer-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LineamentAnalyzer-Windows
          path: dist/LineamentAnalyzer-Windows.zip
          if-no-files-found: error
