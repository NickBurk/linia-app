[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineament-analyzer"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["PySide6>=6.6,<7", "numpy>=1.26,<3", "scipy>=1.11,<2", "opencv-python-headless>=4.8,<6", "rasterio>=1.3,<2", "pyproj>=3.6,<4", "affine>=2.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "pyinstaller>=6,<7"]

[project.scripts]
lineament-analyzer = "lineament_analyzer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
